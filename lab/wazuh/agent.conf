<!--
  Centralized agent config, pushed by the manager to every agent in group "default".
  Deployed to /var/ossec/etc/shared/default/agent.conf inside the manager container
  (see lab/wazuh/push_rules.sh). Keeping the Windows channels here means a
  reinstall/upgrade of the agent MSI can't silently drop Sysmon collection again.
-->
<agent_config os="Windows">
  <!-- Sysmon: rules 100005, 100013, 100201, 100205, 100206 -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell 4104 script block logging (supporting evidence for 100005) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
