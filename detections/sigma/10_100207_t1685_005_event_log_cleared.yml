title: Windows Security or System Event Log Cleared (SOC-100207)
id: 6d4f8a10-1207-4b19-9a10-000000100207
status: stable
description: Detects clearing of the Windows Security (Event ID 1102) or System/Application (Event ID 104) event logs via wevtutil or Event Viewer. Maps to ATT&CK v19 Defense Impairment tactic (TA0112, T1685.005).
references:
  - https://attack.mitre.org/techniques/T1685/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_audit_log_cleared.yml
author: Mohammad Bustami (Adapted from SigmaHQ)
date: 2026-10-19
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 1102
      - 104
  condition: selection
falsepositives:
  - Authorized maintenance window log rotation with an approved change ticket
level: high
