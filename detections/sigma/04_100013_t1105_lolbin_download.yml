title: Ingress Tool Transfer via Windows LOLBins (SOC-100013)
id: 6d4f8a10-1013-4b19-9a04-000000100013
status: stable
description: Detects built-in Windows binaries (certutil, bitsadmin, mshta, regsvr32) used to download remote files over HTTP/HTTPS.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download.yml
author: Saif Asender (Adapted from SigmaHQ)
date: 2026-10-19
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\mshta.exe'
      - '\regsvr32.exe'
  selection_cli:
    CommandLine|contains:
      - '-urlcache'
      - '-verifyctl'
      - '/transfer'
      - 'http://'
      - 'https://'
      - 'scrobj.dll'
  condition: selection_img and selection_cli
falsepositives:
  - Rare administrative CRL verification or legacy BITS scripts
level: high
